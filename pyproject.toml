[project]
name = "michaelspost-docs"
version = "0.1.0"
description = "Static documentation hub for Michael's public projects"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "jsonschema>=4.23,<5",
  "mkdocs-material>=9.6,<10",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
