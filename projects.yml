version: 1
families:
  - id: gate-stack
    title: Gate stack
    order: 10
    description: Fingerprint gates, their shared node library, control plane, and privacy-limited signals.
  - id: agent-tooling
    title: Agent tooling
    order: 20
    description: Capability routing, durable memory, and artifact publishing for agents and people.
  - id: infrastructure-applications
    title: Infrastructure applications
    order: 30
    description: Self-hosted monitoring, DNS operations, and structured notifications.
  - id: shared-libraries
    title: Shared libraries
    order: 40
    description: Focused packages shared by Go applications and browser notification clients.

